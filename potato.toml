id = "minigames"
display_name = { en = "Minigames", ru = "Миниигры" }
minecraft = "26.3"
loader = "fabric"
loader_version = "0.20.1"
auth_backend = { type = "telegram", auth_base_url = "https://mc-auth.petr1furious.me" }

[publish]
base_url = "https://mc.petr1furious.me/data"
target = "rsync://minecraft@petr1furious.me/home/minecraft/srv/potato-launcher/site/data"
mirror = true

[client]
resource_sync = "on_update"
mod_sync = "mirror"

[[client.optional_sets]]
id = "voxy-set"
display_name = "Voxy"
enabled_by_default = true
mods = ["voxy-windows", "voxy-macos"]

[[client.optional_sets]]
id = "replay-mod-set"
display_name = "Replay Mod"
enabled_by_default = false
mods = ["replaymod"]

[[client.optional_sets]]
id = "litematica-set"
display_name = "Litematica"
enabled_by_default = false
mods = ["litematica", "malilib"]

[[paths]]
path = "config/sodium-options.json"
type = "file"
overwrite = false

[[paths]]
path = "config/sodium-extra-options.json"
type = "file"
overwrite = false

[[paths]]
path = "config/moreculling.toml"
type = "file"
overwrite = false

[[paths]]
path = "config/lambdynlights.toml"
type = "file"
overwrite = false

[[paths]]
path = "config/cwb.json"
type = "file"
overwrite = false

[[paths]]
path = "resourcepacks"
type = "directory"
delete_extra = false

[[paths]]
path = "options.txt"
type = "file"
overwrite = false

[[paths]]
path = "options.txt"
type = "config_options"
config_type = "properties"
version = 1
options = [
  { key = ["resourcePacks"], value = '["vanilla","file/LowOnFire v26.2§8.zip"]' },
]

[[paths]]
path = "servers.dat"
type = "file"
overwrite = true
version = 1
